name: CI Security & Quality Verification

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  audit-and-test:
    name: TypeScript & Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Strict TypeScript Verification
        run: npx tsc --noEmit

      - name: Run Playwright Tests (Unit & Security Audit)
        run: npx playwright test tests/security-audit.spec.ts --project=chromium
        env:
          NODE_ENV: test
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_SECRET_KEY: ${{ secrets.ADMIN_SECRET_KEY }}

